name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  lint-meta:
    name: Metadata and Syntax Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gadget_changed: ${{ steps.gadget-diff.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check for user gadget changes
        id: gadget-diff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ ! -f scripts/user-gadget.js ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git diff --quiet "$BEFORE_SHA" "$HEAD_SHA" -- scripts/user-gadget.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Lint Python code with Ruff
        run: uv run ruff check --output-format=github .

      - name: Check Python formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint workflow and Dependabot YAML files
        run: |
          uvx --python 3.14 yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}, new-line-at-end-of-file: disable}}" .github/

  backend:
    name: Backend Checks and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: 71f381c61b34b373d956482ca0fb67080c0bb4a54987da84bb3e0436d809506db08c191a8fde4494f6a5e099fc908cd44b8d1709c294d24eb7c3d6afb09a2b11

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run Django deploy and migration checks
        run: |
          uv run python manage.py check --deploy --fail-level WARNING
          uv run python manage.py makemigrations --check --dry-run

      - name: Run Django test suite
        run: uv run python manage.py test --verbosity 2

  frontend:
    name: Frontend Lint, Typecheck and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint frontend code with Oxlint
        run: npx oxlint -c .oxlintrc.json src vite.config.ts

      - name: Check TypeScript and Vue types
        run: npm run typecheck

      - name: Run frontend unit tests
        run: npm test

      - name: Build frontend bundle
        env:
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: |
          npm run build
          test -f dist/index.html && test -d dist/assets

      - name: Upload built frontend dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  static-assets:
    name: Django Collectstatic Verification
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_SECRET_KEY: 71f381c61b34b373d956482ca0fb67080c0bb4a54987da84bb3e0436d809506db08c191a8fde4494f6a5e099fc908cd44b8d1709c294d24eb7c3d6afb09a2b11

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Download built frontend dist artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: dist/

      - name: Install production Python dependencies
        run: uv sync --locked --no-dev

      - name: Verify collectstatic and WhiteNoise compression
        run: |
          test -f dist/index.html && test -d dist/assets
          uv run python manage.py collectstatic --noinput --clear
          test -d staticfiles && test -n "$(ls -A staticfiles)"

  deploy-dev:
    name: Deploy to Toolforge Dev
    needs: [lint-meta, backend, frontend, static-assets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/_common-deploy.yml
    secrets: inherit
    with:
      target_branch: dev
      toolforge_tool: proxycheck-dev
      environment_name: Toolforge Dev
      environment_url: https://proxycheck-dev.toolforge.org/
      verified_sha: ${{ github.sha }}

  deploy-prod:
    name: Deploy to Toolforge
    needs: [lint-meta, backend, frontend, static-assets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_common-deploy.yml
    secrets: inherit
    with:
      target_branch: main
      toolforge_tool: proxycheck
      environment_name: Toolforge
      environment_url: https://proxycheck.toolforge.org/
      verified_sha: ${{ github.sha }}

  deploy-gadget:
    name: Deploy User Gadget to Meta-Wiki
    needs: [lint-meta, backend, frontend, static-assets, deploy-prod]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && github.repository == 'cchamish/proxycheck'
      && needs.lint-meta.outputs.gadget_changed == 'true'
    uses: ./.github/workflows/deploy-gadget.yml
    secrets: inherit
    with:
      verified_sha: ${{ github.sha }}
