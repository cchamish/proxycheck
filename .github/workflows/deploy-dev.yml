name: Deploy to Toolforge Dev

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    uses: ./.github/workflows/_common-deploy.yml
    secrets: inherit
    with:
      target_branch: dev
      toolforge_tool: proxycheck-dev
      environment_name: Toolforge Dev
      environment_url: https://proxycheck-dev.toolforge.org/
      verified_sha: ${{ github.sha }}
