name: Deploy to Toolforge Dev

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - dev
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: toolforge-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: Toolforge Dev
      url: https://proxycheck-dev.toolforge.org/
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify dev branch tip matches CI commit
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          TARGET_BRANCH: dev
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Toolforge build start currently rejects raw commit hashes (phab:T429227),
          # so confirm the branch ref still points to the verified CI commit before building.
          remote_sha="$(git ls-remote "$REPO_URL" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [ "$remote_sha" != "$VERIFIED_SHA" ]; then
            echo "Remote refs/heads/$TARGET_BRANCH ($remote_sha) does not match verified commit $VERIFIED_SHA."
            exit 1
          fi

      - name: Check out verified commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Configure SSH credentials
        env:
          TOOLFORGE_HOST: ${{ secrets.TOOLFORGE_HOST }}
          TOOLFORGE_SSH_KEY: ${{ secrets.TOOLFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TOOLFORGE_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$TOOLFORGE_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger remote Build Service deployment on Toolforge-dev
        env:
          TOOLFORGE_USER: ${{ secrets.TOOLFORGE_USER }}
          TOOLFORGE_HOST: ${{ secrets.TOOLFORGE_HOST }}
          TARGET_BRANCH: dev
          TOOLFORGE_TOOL: proxycheck-dev
          VITE_GITHUB_REPO: ${{ github.repository }}
          REPO_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          VITE_COMMIT_HASH="$(git rev-parse --short HEAD)"
          VITE_COMMIT_TIMESTAMP="$(TZ=UTC0 LC_ALL=C git log -1 --format=%cd --date='format-local:%H:%M %d %b %Y (UTC)')"
          {
            printf 'target_branch=%q\n' "$TARGET_BRANCH"
            printf 'toolforge_tool=%q\n' "$TOOLFORGE_TOOL"
            printf 'vite_github_repo=%q\n' "$VITE_GITHUB_REPO"
            printf 'vite_commit_hash=%q\n' "$VITE_COMMIT_HASH"
            printf 'vite_commit_timestamp=%q\n' "$VITE_COMMIT_TIMESTAMP"
            printf 'repo_git_url=%q\n' "$REPO_GIT_URL"
            cat << 'EOF'
              set -euo pipefail

              for _ in {1..30}; do
                current_status="$(toolforge build show 2>/dev/null | awk -F': ' '/^[[:space:]]*Status:/ {print tolower($2)}' || true)"
                if [[ "$current_status" == "running" || "$current_status" == "pending" ]]; then
                  echo "Previous build is still $current_status, waiting 10s..."
                  sleep 10
                else
                  break
                fi
              done

              echo "Building ASGI container image via Toolforge Build Service"
              build_output="$(mktemp)"
              if toolforge build start \
                  --ref "$target_branch" \
                  --envvar "VITE_GITHUB_REPO=$vite_github_repo" \
                  --envvar "VITE_COMMIT_HASH=$vite_commit_hash" \
                  --envvar "VITE_COMMIT_TIMESTAMP=$vite_commit_timestamp" \
                  "$repo_git_url" 2>&1 | tee "$build_output"; then
                rm -f "$build_output"
              else
                if ! grep -Eiq 'BuildClientError: Error getting the logs|container .* is not available' "$build_output"; then
                  echo "Toolforge build failed before a recoverable log-read error."
                  rm -f "$build_output"
                  exit 1
                fi
                rm -f "$build_output"

                echo "Build log stream disconnected early; polling 'toolforge build show' until completion..."
                build_recovered=false
                for attempt in {1..30}; do
                  sleep 10
                  if ! build_status="$(toolforge build show 2>&1)"; then
                    echo "[$attempt/30] Unable to query build status yet, retrying..."
                    continue
                  fi

                  if ! grep -Fq "VITE_COMMIT_HASH=$vite_commit_hash" <<< "$build_status"; then
                    echo "[$attempt/30] Waiting for build of commit $vite_commit_hash to register..."
                    continue
                  fi

                  status_val="$(awk -F': ' '/^[[:space:]]*Status:/ {print tolower($2); exit}' <<< "$build_status")"
                  echo "[$attempt/30] Current build status: ${status_val:-unknown}"

                  case "$status_val" in
                    ok|succeeded|success)
                      echo "$build_status"
                      build_recovered=true
                      break
                      ;;
                    failed|error|cancelled|aborted)
                      echo "$build_status"
                      break
                      ;;
                  esac
                done

                if [[ "$build_recovered" != true ]]; then
                  echo "Toolforge build did not reach a successful state."
                  exit 1
                fi
              fi

              echo "Restarting Build Service web service and verifying status"
              if ! toolforge webservice buildservice restart --mount=all; then
                toolforge webservice stop 2>/dev/null || true
                toolforge webservice buildservice start --mount=all
              fi
              sleep 6
              toolforge webservice status
          EOF
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${TOOLFORGE_USER}@${TOOLFORGE_HOST}" "become $TOOLFORGE_TOOL bash -s"

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_deploy
