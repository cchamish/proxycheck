name: Deploy User Gadget to Meta-Wiki

on:
  workflow_call:
    inputs:
      verified_sha:
        description: Commit SHA verified by CI
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Minify and Deploy User Gadget
    concurrency:
      group: deploy-gadget-meta
      cancel-in-progress: false
    runs-on: macos-latest
    timeout-minutes: 10
    if: ${{ github.repository == 'cchamish/proxycheck' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.verified_sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install npm dependencies
        run: npm ci

      - name: Minify and deploy gadget to Meta-Wiki
        env:
          MW_API_URL: ${{ secrets.MW_API_URL }}
          MW_USERNAME: ${{ secrets.MW_USERNAME }}
          MW_PASSWORD: ${{ secrets.MW_PASSWORD }}
        run: node scripts/deploy-gadget.mjs
