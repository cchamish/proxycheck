name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  deployments: write

concurrency:
  group: toolforge-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: Toolforge
      url: https://proxycheck.toolforge.org/
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify main branch tip matches CI commit
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Toolforge build start currently rejects raw commit hashes (phab:T429227),
          # so confirm the branch ref still points to the verified CI commit before building.
          remote_sha="$(git ls-remote "$REPO_URL" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [ "$remote_sha" != "$VERIFIED_SHA" ]; then
            echo "Remote refs/heads/$TARGET_BRANCH ($remote_sha) does not match verified commit $VERIFIED_SHA."
            exit 1
          fi

      - name: Check out verified commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Configure SSH credentials
        env:
          TOOLFORGE_HOST: ${{ secrets.TOOLFORGE_HOST }}
          TOOLFORGE_SSH_KEY: ${{ secrets.TOOLFORGE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TOOLFORGE_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$TOOLFORGE_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Trigger remote Build Service deployment on Toolforge
        env:
          TOOLFORGE_USER: ${{ secrets.TOOLFORGE_USER }}
          TOOLFORGE_HOST: ${{ secrets.TOOLFORGE_HOST }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          VITE_GITHUB_REPO: ${{ github.repository }}
          REPO_GIT_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          VITE_COMMIT_HASH="$(git rev-parse --short HEAD)"
          VITE_COMMIT_TIMESTAMP="$(TZ=UTC0 LC_ALL=C git log -1 --format=%cd --date='format-local:%H:%M %d %b %Y (UTC)')"
          {
            printf 'target_branch=%q\n' "$TARGET_BRANCH"
            printf 'vite_github_repo=%q\n' "$VITE_GITHUB_REPO"
            printf 'vite_commit_hash=%q\n' "$VITE_COMMIT_HASH"
            printf 'vite_commit_timestamp=%q\n' "$VITE_COMMIT_TIMESTAMP"
            printf 'repo_git_url=%q\n' "$REPO_GIT_URL"
            cat << 'EOF'
              set -euo pipefail

              echo "Building ASGI container image via Toolforge Build Service"
              build_output="$(mktemp)"
              if toolforge build start \
                  --ref "$target_branch" \
                  --envvar "VITE_GITHUB_REPO=$vite_github_repo" \
                  --envvar "VITE_COMMIT_HASH=$vite_commit_hash" \
                  --envvar "VITE_COMMIT_TIMESTAMP=$vite_commit_timestamp" \
                  "$repo_git_url" 2>&1 | tee "$build_output"; then
                rm -f "$build_output"
              else
                if ! grep -Eiq 'BuildClientError: Error getting the logs|container .* is not available' "$build_output"; then
                  echo "Toolforge build failed before a recoverable log-read error:"
                  cat "$build_output"
                  rm -f "$build_output"
                  exit 1
                fi
                echo "Build start returned an error; checking the existing build before failing."
                build_recovered=false
                for wait_seconds in 15 30; do
                  sleep "$wait_seconds"
                  if ! build_status="$(toolforge build show 2>&1)"; then
                    echo "Unable to query the build status yet:"
                    echo "$build_status"
                    continue
                  fi
                  echo "$build_status"
                  if grep -Eiq 'succeeded|success' <<< "$build_status"; then
                    build_recovered=true
                    break
                  fi
                  if grep -Eiq 'failed|error|cancelled' <<< "$build_status"; then
                    break
                  fi
                done
                if [[ "$build_recovered" != true ]]; then
                  echo "Toolforge build did not reach a successful state."
                  cat "$build_output"
                  rm -f "$build_output"
                  exit 1
                fi
                rm -f "$build_output"
              fi

              echo "Restarting Build Service web service and verifying status"
              if ! toolforge webservice buildservice restart --mount=all; then
                toolforge webservice stop 2>/dev/null || true
                toolforge webservice buildservice start --mount=all
              fi
              sleep 6
              toolforge webservice status
          EOF
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes "${TOOLFORGE_USER}@${TOOLFORGE_HOST}" "become proxycheck bash -s"

      - name: Clean up SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_deploy
