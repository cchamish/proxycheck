---
- name: update-sfs-db
  command: python manage.py update_offline_dbs --sources stopforumspam
  image: tool-proxycheck/tool-proxycheck:latest
  schedule: "@hourly"
  mount: all
  filelog: true
  filelog-stdout: data/logs/cron/update-sfs-db.out
  filelog-stderr: data/logs/cron/update-sfs-db.err
